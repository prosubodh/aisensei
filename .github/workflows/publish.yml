name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify the publishable tarball without uploading"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Before Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify Environment
        run: |
          node --version
          npm --version

      - name: Verify TypeScript Compilation & lib/ Parity
        run: |
          npm run build
          npm run typecheck

      - name: Validate Pedagogical Architecture
        run: npm run validate

      - name: Run Test Suite
        run: npm test

      - name: Verify Coverage Gates
        run: npm run test:coverage

      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version $pkg_version matches tag $GITHUB_REF_NAME"

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build Library
        run: npm run build

      - name: Dry run (no upload)
        if: inputs.dry-run == true
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: npx jsr publish
